name: Prometheus Rules

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  promtool:
    uses: umatare5/common/.github/workflows/promtool.yml@8044b3c0ce0dce6411ec179c3ec0e675219c117f # v0.21.0
    with:
      promtool_version: "3.14.0"
      rule_files: |
        prometheus.rules.sample.yml
      config_files: |
        prometheus.sample.yml
      lint: "all"
