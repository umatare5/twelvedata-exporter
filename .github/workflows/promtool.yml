    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  promtool:
    uses: umatare5/common/.github/workflows/promtool.yml@2dc181f4ceb6cd36a063f968d42c22953b554efd # v0.22.0
