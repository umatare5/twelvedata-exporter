# .goreleaser.yml for twelvedata-exporter

project_name: twelvedata-exporter
version: 2

# Distribution directory
dist: tmp/dist

# Build destination
github_urls:
  # set to true if you use a self-signed certificate
  skip_tls_verify: false

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - main: ./cmd
    id: twelvedata-exporter
    binary: twelvedata-exporter
    flags:
      - -trimpath
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X 'github.com/umatare5/twelvedata-exporter/cli.version={{ .Version }}'
    hooks:
      post:
        # The setting is recorded in the binary, so this fails the release if cgo returns
        - cmd: grep -q CGO_ENABLED=0 {{ .Path }}

archives:
  - name_template: '{{ .ProjectName }}-v{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    files:
      - "README.md"
      - "CHANGELOG.md"
      - "prometheus.sample.yml"
      - "prometheus.rules.sample.yml"
      - "LICENSE"
    format_overrides:
      - goos: windows
        formats: ["zip"]

# Docker configuration
dockers_v2:
  - images:
      - ghcr.io/umatare5/twelvedata-exporter
    tags:
      - latest
      - "{{ .Tag }}"
      - "v{{ .Major }}"
      - "v{{ .Major }}.{{ .Minor }}"
    platforms:
      - linux/amd64
      - linux/arm64
    ids:
      - twelvedata-exporter
    # A prerelease must not move latest or the version tags. buildx builds and
    # pushes in one step, so the whole configuration is disabled instead of
    # skipping the push; snapshot builds stay enabled for local verification.
    disable: '{{ and (not .IsSnapshot) (ne .Prerelease "") }}'
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "Prometheus Exporter for Twelve Data"
      "org.opencontainers.image.url": "https://github.com/umatare5/twelvedata-exporter"
      "org.opencontainers.image.source": "https://github.com/umatare5/twelvedata-exporter"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.licenses": "MIT"
    extra_files:
      - "LICENSE"

release:
  prerelease: auto
  draft: false
  replace_existing_draft: true
  header: |
    ## {{ .ProjectName }} v{{ .Version }}

    This release contains the Prometheus Exporter for Twelve Data.

    ### 🐳 Container Images

    ```bash
    # Latest version
    docker run --rm ghcr.io/umatare5/twelvedata-exporter:latest --help

    # Specific version
    docker run --rm ghcr.io/umatare5/twelvedata-exporter:{{ .Tag }} --help

    # With environment variables
    docker run --rm -e TWELVEDATA_API_KEY ghcr.io/umatare5/twelvedata-exporter:{{ .Tag }} command
    ```

    ### 📦 Binary Installation

    ```bash
    go install github.com/umatare5/twelvedata-exporter@v{{ .Version }}
    ```

  footer: |
    **Full Changelog**: https://github.com/umatare5/twelvedata-exporter/compare/{{ .PreviousTag }}...{{ .Tag }}

    ### 📚 Documentation

    - [README](https://github.com/umatare5/twelvedata-exporter/blob/{{ .Tag }}/README.md)
    - [CHANGELOG](https://github.com/umatare5/twelvedata-exporter/blob/{{ .Tag }}/CHANGELOG.md)
    - [Container Registry](https://github.com/umatare5/twelvedata-exporter/pkgs/container/twelvedata-exporter)

# Generate checksums for source archives
checksum:
  name_template: "{{ .ProjectName }}-v{{ .Version }}_checksums.txt"

# Changelog configuration
changelog:
  use: github
  sort: asc
  abbrev: 0
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Documentation Updates
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - '^Merge branch '
      - '^release:'
      - '^ci:'
      - '^test:'

# Metadata for Go proxy and pkg.go.dev
metadata:
  mod_timestamp: '{{ .CommitTimestamp }}'
